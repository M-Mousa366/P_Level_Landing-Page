<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="منصة نادي المبرمجين — تعلم وتدريب وواجبات ومتابعة">
  <title>نادي المبرمجين — تعلم + تدريب + واجبات + متابعة</title>
  <desc>واجهة منصة تعليمية رقمية تظهر فيديوهات شرح وواجبات وتقدم الطالب</desc>

  <!-- Background -->
  <rect width="800" height="600" fill="#ecfdf5"/>
  <rect width="800" height="600" fill="#f0faf6"/>

  <!-- Browser / app window frame -->
  <rect x="40" y="30" width="720" height="520" rx="14" fill="white" filter="url(#windowShadow)"/>
  <defs>
    <filter id="windowShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#047857" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Title bar -->
  <rect x="40" y="30" width="720" height="44" rx="14" fill="#064e3b"/>
  <rect x="40" y="58" width="720" height="16" fill="#064e3b"/>
  <!-- Traffic lights -->
  <circle cx="70"  cy="52" r="8" fill="#ef4444" opacity="0.8"/>
  <circle cx="94"  cy="52" r="8" fill="#f59e0b" opacity="0.8"/>
  <circle cx="118" cy="52" r="8" fill="#22c55e" opacity="0.8"/>
  <!-- Platform name in bar -->
  <text x="400" y="58" font-family="Cairo, sans-serif" font-size="16" font-weight="700" fill="white" opacity="0.9" text-anchor="middle">نادي المبرمجين</text>

  <!-- Sidebar -->
  <rect x="40" y="74" width="148" height="476" rx="0" fill="#f0fdf4"/>
  <rect x="186" y="74" width="2" height="476" fill="#d1fae5"/>

  <!-- Sidebar nav items -->
  <rect x="52" y="96"  width="124" height="36" rx="8" fill="#059669" opacity="0.15"/>
  <rect x="64" y="108" width="60"  height="8"  rx="4" fill="#047857" opacity="0.7"/>
  <rect x="52" y="140" width="124" height="36" rx="8" fill="transparent"/>
  <rect x="64" y="152" width="50"  height="8"  rx="4" fill="#6b7280" opacity="0.4"/>
  <rect x="52" y="184" width="124" height="36" rx="8" fill="transparent"/>
  <rect x="64" y="196" width="70"  height="8"  rx="4" fill="#6b7280" opacity="0.4"/>
  <rect x="52" y="228" width="124" height="36" rx="8" fill="transparent"/>
  <rect x="64" y="240" width="55"  height="8"  rx="4" fill="#6b7280" opacity="0.4"/>
  <rect x="52" y="272" width="124" height="36" rx="8" fill="transparent"/>
  <rect x="64" y="284" width="65"  height="8"  rx="4" fill="#6b7280" opacity="0.4"/>

  <!-- Progress ring in sidebar -->
  <circle cx="116" cy="380" r="44" fill="none" stroke="#d1fae5" stroke-width="10"/>
  <circle cx="116" cy="380" r="44" fill="none" stroke="#059669" stroke-width="10"
          stroke-dasharray="207" stroke-dashoffset="62" stroke-linecap="round"
          transform="rotate(-90 116 380)"/>
  <text x="116" y="376" font-family="sans-serif" font-size="16" font-weight="700" fill="#047857" text-anchor="middle">70%</text>
  <text x="116" y="394" font-family="Cairo, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">تقدمك</text>

  <!-- Main content area -->
  <!-- ── Section 1: Video lecture thumbnails ── -->
  <text x="208" y="102" font-family="Cairo, sans-serif" font-size="14" font-weight="700" fill="#064e3b">فيديوهات الشرح</text>

  <!-- Video card 1 (active / playing) -->
  <rect x="200" y="112" width="172" height="110" rx="8" fill="#064e3b"/>
  <!-- Video content placeholder -->
  <rect x="208" y="120" width="156" height="80" rx="4" fill="#0d5c40"/>
  <!-- Play indicator (screen content) -->
  <rect x="216" y="128" width="100" height="6" rx="3" fill="white" opacity="0.25"/>
  <rect x="216" y="140" width="70"  height="5" rx="3" fill="white" opacity="0.15"/>
  <rect x="216" y="150" width="90"  height="5" rx="3" fill="#10b981" opacity="0.35"/>
  <rect x="216" y="160" width="60"  height="5" rx="3" fill="white" opacity="0.15"/>
  <!-- Play button -->
  <circle cx="310" cy="160" r="20" fill="white" opacity="0.15"/>
  <polygon points="304,150 304,170 324,160" fill="white" opacity="0.8"/>
  <!-- "جاري التشغيل" tag -->
  <rect x="200" y="112" width="80" height="20" rx="4" fill="#10b981"/>
  <text x="240" y="126" font-family="Cairo, sans-serif" font-size="9" font-weight="700" fill="white" text-anchor="middle">جاري التشغيل</text>
  <!-- Duration bar -->
  <rect x="208" y="204" width="156" height="5" rx="2" fill="#0d5c40"/>
  <rect x="208" y="204" width="90"  height="5" rx="2" fill="#10b981"/>
  <!-- Video title -->
  <rect x="208" y="214" width="120" height="7"  rx="3" fill="#064e3b" opacity="0.6"/>

  <!-- Video card 2 -->
  <rect x="384" y="112" width="172" height="110" rx="8" fill="#f0fdf4" stroke="#d1fae5" stroke-width="2"/>
  <rect x="392" y="120" width="156" height="80" rx="4" fill="#d1fae5"/>
  <circle cx="516" cy="160" r="18" fill="#059669" opacity="0.30"/>
  <polygon points="511,151 511,169 527,160" fill="#047857" opacity="0.7"/>
  <rect x="392" y="208" width="100" height="6"  rx="3" fill="#4b5563" opacity="0.20"/>

  <!-- Video card 3 -->
  <rect x="568" y="112" width="172" height="110" rx="8" fill="#f0fdf4" stroke="#d1fae5" stroke-width="2"/>
  <rect x="576" y="120" width="156" height="80" rx="4" fill="#d1fae5"/>
  <circle cx="700" cy="160" r="18" fill="#059669" opacity="0.30"/>
  <polygon points="695,151 695,169 711,160" fill="#047857" opacity="0.7"/>
  <rect x="576" y="208" width="100" height="6"  rx="3" fill="#4b5563" opacity="0.20"/>

  <!-- ── Section 2: Homework / assignment panel ── -->
  <text x="208" y="256" font-family="Cairo, sans-serif" font-size="14" font-weight="700" fill="#064e3b">الواجبات</text>

  <!-- Assignment row 1 — submitted, corrected -->
  <rect x="200" y="268" width="552" height="52" rx="8" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1.5"/>
  <rect x="212" y="280" width="12" height="12" rx="3" fill="#059669"/>
  <!-- Check mark inside -->
  <text x="218" y="291" font-family="sans-serif" font-size="10" fill="white" text-anchor="middle">✓</text>
  <rect x="234" y="280" width="140" height="8"  rx="4" fill="#1a1a2e" opacity="0.18"/>
  <rect x="234" y="294" width="90"  height="6"  rx="3" fill="#1a1a2e" opacity="0.10"/>
  <!-- "تم التصحيح" badge -->
  <rect x="668" y="275" width="72" height="22" rx="11" fill="#059669"/>
  <text x="704" y="290" font-family="Cairo, sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">تم التصحيح</text>
  <!-- Score -->
  <text x="604" y="291" font-family="sans-serif" font-size="16" font-weight="700" fill="#047857" text-anchor="middle">95/100</text>

  <!-- Assignment row 2 — pending correction -->
  <rect x="200" y="328" width="552" height="52" rx="8" fill="white" stroke="#d1fae5" stroke-width="1.5"/>
  <rect x="212" y="340" width="12" height="12" rx="3" fill="#f59e0b" opacity="0.8"/>
  <rect x="234" y="340" width="160" height="8"  rx="4" fill="#1a1a2e" opacity="0.18"/>
  <rect x="234" y="354" width="100" height="6"  rx="3" fill="#1a1a2e" opacity="0.10"/>
  <rect x="640" y="338" width="100" height="22" rx="11" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <text x="690" y="353" font-family="Cairo, sans-serif" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">قيد التصحيح</text>

  <!-- Assignment row 3 — new / not submitted -->
  <rect x="200" y="388" width="552" height="52" rx="8" fill="white" stroke="#d1fae5" stroke-width="1.5"/>
  <rect x="212" y="400" width="12" height="12" rx="3" fill="#e5e7eb"/>
  <rect x="234" y="400" width="120" height="8"  rx="4" fill="#1a1a2e" opacity="0.18"/>
  <rect x="234" y="414" width="80"  height="6"  rx="3" fill="#1a1a2e" opacity="0.10"/>
  <rect x="648" y="398" width="92" height="22" rx="11" fill="#064e3b"/>
  <text x="694" y="413" font-family="Cairo, sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">ارفع الواجب</text>

  <!-- ── Section 3: Progress stats ── -->
  <rect x="200" y="454" width="172" height="70" rx="8" fill="#f0fdf4" stroke="#d1fae5" stroke-width="1.5"/>
  <text x="286" y="474" font-family="Cairo, sans-serif" font-size="11" font-weight="600" fill="#047857" text-anchor="middle">واجبات مرفوعة</text>
  <text x="286" y="502" font-family="sans-serif" font-size="24" font-weight="800" fill="#064e3b" text-anchor="middle">12</text>

  <rect x="384" y="454" width="172" height="70" rx="8" fill="#f0fdf4" stroke="#d1fae5" stroke-width="1.5"/>
  <text x="470" y="474" font-family="Cairo, sans-serif" font-size="11" font-weight="600" fill="#047857" text-anchor="middle">اختبارات اجتزتها</text>
  <text x="470" y="502" font-family="sans-serif" font-size="24" font-weight="800" fill="#064e3b" text-anchor="middle">8</text>

  <rect x="568" y="454" width="172" height="70" rx="8" fill="#f0fdf4" stroke="#d1fae5" stroke-width="1.5"/>
  <text x="654" y="474" font-family="Cairo, sans-serif" font-size="11" font-weight="600" fill="#047857" text-anchor="middle">Challenges</text>
  <text x="654" y="502" font-family="sans-serif" font-size="24" font-weight="800" fill="#064e3b" text-anchor="middle">5</text>

  <!-- Caption -->
  <rect x="0" y="550" width="800" height="50" fill="#064e3b" opacity="0.92"/>
  <text x="400" y="582" font-family="Cairo, sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">تعلم + تدريب + واجبات + متابعة</text>
</svg>
