<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="طالب يحضر حصة في السنتر — شرح مباشر وتفاعل مع المدرس">
  <title>الحضور في السنتر — حضور + شرح مباشر + تفاعل</title>
  <desc>مشهد فصل دراسي: مدرس يشرح على اللوح وطلاب يتفاعلون</desc>

  <!-- Background: warm classroom wall -->
  <rect width="800" height="600" fill="#f0e9db"/>

  <!-- Ceiling / upper wall -->
  <rect width="800" height="80" fill="#e8dfd0"/>

  <!-- Floor -->
  <rect y="480" width="800" height="120" fill="#e0d5c4"/>
  <rect y="478" width="800" height="4" fill="#d4c9b8"/>

  <!-- Back wall separation -->
  <rect y="80" width="800" height="400" fill="#f5f0e8"/>

  <!-- Whiteboard frame -->
  <rect x="80" y="100" width="440" height="240" rx="4" fill="#e8e0f0" stroke="#c8c0d8" stroke-width="3"/>
  <!-- Whiteboard surface -->
  <rect x="88" y="108" width="424" height="224" rx="2" fill="#fafafa"/>

  <!-- Whiteboard content: code/lesson title -->
  <text x="300" y="148" font-family="monospace" font-size="18" font-weight="bold" fill="#2d2d44" text-anchor="middle">البرمجة — الدرس الأول</text>

  <!-- Code lines on board -->
  <rect x="108" y="162" width="180" height="10" rx="3" fill="#4a4a6a" opacity="0.20"/>
  <rect x="108" y="180" width="240" height="9" rx="3" fill="#4a4a6a" opacity="0.15"/>
  <rect x="128" y="196" width="200" height="9" rx="3" fill="#14a085" opacity="0.25"/>
  <rect x="128" y="212" width="160" height="9" rx="3" fill="#14a085" opacity="0.20"/>
  <rect x="108" y="228" width="220" height="9" rx="3" fill="#4a4a6a" opacity="0.15"/>
  <rect x="108" y="244" width="140" height="9" rx="3" fill="#4a4a6a" opacity="0.10"/>
  <rect x="108" y="260" width="180" height="9" rx="3" fill="#4a4a6a" opacity="0.10"/>

  <!-- Code block (right side of board) -->
  <rect x="320" y="162" width="172" height="140" rx="6" fill="#1a1a2e" opacity="0.07"/>
  <rect x="332" y="174" width="90" height="7" rx="3" fill="#1a1a2e" opacity="0.18"/>
  <rect x="332" y="188" width="120" height="6" rx="3" fill="#14a085" opacity="0.30"/>
  <rect x="344" y="200" width="100" height="6" rx="3" fill="#14a085" opacity="0.22"/>
  <rect x="344" y="212" width="80"  height="6" rx="3" fill="#4a4a6a" opacity="0.18"/>
  <rect x="332" y="224" width="110" height="6" rx="3" fill="#1a1a2e" opacity="0.12"/>
  <rect x="332" y="236" width="70"  height="6" rx="3" fill="#1a1a2e" opacity="0.10"/>
  <rect x="332" y="248" width="90"  height="6" rx="3" fill="#14a085" opacity="0.18"/>
  <rect x="332" y="260" width="60"  height="6" rx="3" fill="#1a1a2e" opacity="0.10"/>
  <rect x="332" y="272" width="75"  height="6" rx="3" fill="#4a4a6a" opacity="0.15"/>

  <!-- Whiteboard tray -->
  <rect x="80" y="340" width="440" height="10" rx="2" fill="#c8c0d8"/>

  <!-- Board markers on tray -->
  <rect x="100" y="342" width="20" height="6" rx="3" fill="#14a085"/>
  <rect x="128" y="342" width="20" height="6" rx="3" fill="#3b82f6"/>
  <rect x="156" y="342" width="20" height="6" rx="3" fill="#1a1a2e"/>

  <!-- Teacher figure -->
  <!-- Head -->
  <circle cx="600" cy="168" r="28" fill="#c8a882"/>
  <!-- Body -->
  <rect x="570" y="198" width="60" height="80" rx="10" fill="#2d2d44"/>
  <!-- Pointing arm toward board -->
  <line x1="570" y1="230" x2="530" y2="200" stroke="#c8a882" stroke-width="10" stroke-linecap="round"/>
  <!-- Pointer -->
  <line x1="528" y1="198" x2="500" y2="185" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
  <!-- Other arm -->
  <line x1="630" y1="225" x2="660" y2="250" stroke="#c8a882" stroke-width="10" stroke-linecap="round"/>
  <!-- Legs -->
  <rect x="578" y="278" width="20" height="60" rx="6" fill="#1a1a2e"/>
  <rect x="602" y="278" width="20" height="60" rx="6" fill="#1a1a2e"/>

  <!-- Student desks row -->
  <!-- Desk 1 -->
  <rect x="80"  y="420" width="120" height="50" rx="6" fill="#d4c9b8"/>
  <rect x="88"  y="428" width="104" height="8" rx="3" fill="white" opacity="0.6"/>
  <rect x="88"  y="442" width="80"  height="6" rx="3" fill="white" opacity="0.4"/>
  <!-- Student 1 head -->
  <circle cx="140" cy="402" r="20" fill="#c8a882"/>
  <!-- Student 1 body -->
  <rect x="120" y="422" width="40" height="30" rx="6" fill="#3b82f6" opacity="0.7"/>

  <!-- Desk 2 -->
  <rect x="240" y="420" width="120" height="50" rx="6" fill="#d4c9b8"/>
  <rect x="248" y="428" width="104" height="8" rx="3" fill="white" opacity="0.6"/>
  <rect x="248" y="442" width="80"  height="6" rx="3" fill="white" opacity="0.4"/>
  <!-- Student 2 head (raised hand) -->
  <circle cx="300" cy="402" r="20" fill="#b8906a"/>
  <rect x="280" y="422" width="40" height="30" rx="6" fill="#8b5cf6" opacity="0.7"/>
  <!-- Raised hand -->
  <line x1="316" y1="400" x2="330" y2="368" stroke="#b8906a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="330" cy="362" r="8" fill="#b8906a"/>

  <!-- Desk 3 -->
  <rect x="400" y="420" width="120" height="50" rx="6" fill="#d4c9b8"/>
  <rect x="408" y="428" width="104" height="8" rx="3" fill="white" opacity="0.6"/>
  <rect x="408" y="442" width="80"  height="6" rx="3" fill="white" opacity="0.4"/>
  <!-- Student 3 head -->
  <circle cx="460" cy="402" r="20" fill="#c8a882"/>
  <rect x="440" y="422" width="40" height="30" rx="6" fill="#14a085" opacity="0.7"/>

  <!-- Desk 4 -->
  <rect x="560" y="420" width="120" height="50" rx="6" fill="#d4c9b8"/>
  <rect x="568" y="428" width="104" height="8" rx="3" fill="white" opacity="0.6"/>
  <rect x="568" y="442" width="80"  height="6" rx="3" fill="white" opacity="0.4"/>
  <!-- Student 4 head -->
  <circle cx="620" cy="402" r="20" fill="#a07850"/>
  <rect x="600" y="422" width="40" height="30" rx="6" fill="#f59e0b" opacity="0.7"/>

  <!-- Caption label -->
  <rect x="0" y="550" width="800" height="50" fill="#1a1a2e" opacity="0.85"/>
  <text x="400" y="582" font-family="Cairo, sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">حضور + شرح مباشر + تفاعل</text>
</svg>
