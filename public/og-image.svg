<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 630" width="1200" height="630"
     xmlns:xlink="http://www.w3.org/1999/xlink">
  <!--
    ════════════════════════════════════════════════════════════════════
    OG IMAGE — د. عيسى صبري
    Dimensions : 1200 × 630 px  (standard for WhatsApp, Facebook, X/Twitter)
    Format     : This SVG must be converted to PNG before deploying.

    HOW TO CONVERT TO PNG (choose one):
    ─────────────────────────────────────────────────────────────────────
    Option A — Browser (simplest):
      1. Open this file in Chrome or Firefox
      2. Right-click → "Save as image" (Chrome)  OR
         Use the browser's built-in "Take screenshot" dev tool at 1200×630
      3. Save as /public/og-image.png

    Option B — Node script (automated):
      Run:  node scripts/generate-og.mjs
      (The script is at e:\Tasabuq\LANDING PAGE\scripts\generate-og.mjs)
      Requires: npm install -D sharp   (one-time)

    Option C — Online tool:
      Upload this file to https://cloudconvert.com/svg-to-png
      Set width=1200, height=630. Download og-image.png → /public/

    AFTER CONVERTING:
      In index.html, change OG_IMAGE_ABSOLUTE_URL to:
        https://YOURDOMAIN.com/og-image.png
    ════════════════════════════════════════════════════════════════════
  -->

  <!-- Background — brand navy matching reference site -->
  <rect width="1200" height="630" fill="#0b1929"/>

  <!-- Subtle texture: very light diagonal pattern for depth -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.06"/>
    </pattern>
    <!-- Radial glow from centre -->
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#2C7A7B" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1B5859" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- ── Top accent bar ───────────────────────────────────────────── -->
  <rect width="1200" height="6" fill="#FAFAF8" opacity="0.15"/>

  <!-- ── Bottom accent bar ────────────────────────────────────────── -->
  <rect y="624" width="1200" height="6" fill="#FAFAF8" opacity="0.15"/>

  <!-- ══════════════════════════════════════════════════════════════
       BRAND MARK  (top-right — RTL convention)
  ══════════════════════════════════════════════════════════════════ -->

  <!-- Icon badge — brand green -->
  <rect x="1100" y="48" width="60" height="60" rx="10" fill="#00c896" opacity="0.20"/>
  <text x="1130" y="90"
        font-family="Cairo, 'Arial Unicode MS', sans-serif"
        font-size="34" font-weight="900"
        fill="#00c896"
        text-anchor="middle"
        dominant-baseline="middle">د</text>

  <!-- Brand name -->
  <text x="1082" y="68"
        font-family="Cairo, 'Arial Unicode MS', sans-serif"
        font-size="22" font-weight="800"
        fill="#FAFAF8"
        text-anchor="end">
    د. عيسى صبري
  </text>

  <!-- Subject line -->
  <text x="1082" y="95"
        font-family="Cairo, 'Arial Unicode MS', sans-serif"
        font-size="15" font-weight="700"
        fill="#FAFAF8" opacity="0.65"
        text-anchor="end">
    البرمجة وعلوم الحاسب — المرحلة الثانوية
  </text>

  <!-- ══════════════════════════════════════════════════════════════
       MAIN MESSAGE  (vertically centred)
  ══════════════════════════════════════════════════════════════════ -->

  <!-- Primary headline — large, high contrast, reads at thumbnail size -->
  <text x="600" y="285"
        font-family="Cairo, 'Arial Unicode MS', sans-serif"
        font-size="72" font-weight="900"
        fill="#FAFAF8"
        text-anchor="middle"
        dominant-baseline="middle">
    اختار طريقة الدراسة
  </text>

  <text x="600" y="375"
        font-family="Cairo, 'Arial Unicode MS', sans-serif"
        font-size="72" font-weight="900"
        fill="#FAFAF8"
        text-anchor="middle"
        dominant-baseline="middle">
    المناسبة ليك.
  </text>

  <!-- Accent underline — brand green -->
  <rect x="480" y="420" width="240" height="5" rx="3" fill="#00c896" opacity="0.60"/>

  <!-- Supporting line -->
  <text x="600" y="475"
        font-family="Cairo, 'Arial Unicode MS', sans-serif"
        font-size="26" font-weight="700"
        fill="#FAFAF8" opacity="0.70"
        text-anchor="middle"
        dominant-baseline="middle">
    4 طرق للدراسة — السنتر · Online Live · الكتب · نادي المبرمجين
  </text>

  <!-- Bottom CTA strip — brand green -->
  <rect x="0" y="548" width="1200" height="82" fill="#00c896" opacity="0.12" rx="0"/>
  <text x="600" y="592"
        font-family="Cairo, 'Arial Unicode MS', sans-serif"
        font-size="22" font-weight="700"
        fill="#FAFAF8" opacity="0.80"
        text-anchor="middle"
        dominant-baseline="middle">
    فريق عمل الدكتور / عيسى صبري
  </text>

</svg>
