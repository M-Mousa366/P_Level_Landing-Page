<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    ══════════════════════════════════════════════════════════════════════
    BEFORE GOING LIVE — replace every placeholder below:

    CANONICAL_URL_PLACEHOLDER  →  the landing page's own production URL
                                  e.g. https://landingpage.eissasabry.com
    OG_IMAGE_ABSOLUTE_URL      →  absolute URL to og-image.png
                                  e.g. https://landingpage.eissasabry.com/og-image.png
                                  (must be absolute — social crawlers ignore relative paths)

    Also:
    - Add /public/apple-touch-icon.png (180×180 PNG) for iOS home screen
    ══════════════════════════════════════════════════════════════════════
  -->

  <!-- ── Document ─────────────────────────────────────────────────── -->
  <title>د. عيسى صبري | اختار طريقة الدراسة المناسبة</title>
  <meta
    name="description"
    content="اختار طريقة الدراسة المناسبة ليك: السنتر، Online Live، كتب شيخ البرمجة، أو نادي المبرمجين."
  />

  <!-- Canonical URL — replace with the final production domain before going live -->
  <link rel="canonical" href="CANONICAL_URL_PLACEHOLDER" />

  <!-- Mobile browser chrome color -->
  <meta name="theme-color" content="#071b35" />

  <!-- ── Favicon & icons ───────────────────────────────────────────── -->
  <!-- Branded favicon -->
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />

  <!-- iOS home screen icon — add /public/apple-touch-icon.png (180×180) -->
  <!-- <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" /> -->

  <!-- ── Open Graph (Facebook, LinkedIn, WhatsApp, iMessage, etc.) ─── -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ar_EG" />
  <meta property="og:site_name" content="د. عيسى صبري" />

  <meta
    property="og:url"
    content="CANONICAL_URL_PLACEHOLDER"
  />

  <meta
    property="og:title"
    content="د. عيسى صبري | اختار طريقة الدراسة المناسبة"
  />

  <meta
    property="og:description"
    content="اختار طريقة الدراسة المناسبة ليك: السنتر، Online Live، كتب شيخ البرمجة، أو نادي المبرمجين."
  />

  <!--
    OG image:
    Temporary Vercel URL for testing.
    Replace with the final production domain before going live.

    File: /public/og-image.png
    Dimensions: 1200×630
  -->
  <meta
    property="og:image"
    content="https://finallandingpage-phi.vercel.app/og-image.png"
  />

  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <meta
    property="og:image:alt"
    content="د. عيسى صبري — اختار طريقة الدراسة المناسبة ليك"
  />

  <!-- ── Twitter / X Card ─────────────────────────────────────────── -->
  <meta name="twitter:card" content="summary_large_image" />

  <meta
    name="twitter:title"
    content="د. عيسى صبري | اختار طريقة الدراسة المناسبة"
  />

  <meta
    name="twitter:description"
    content="اختار طريقة الدراسة المناسبة ليك: السنتر، Online Live، كتب شيخ البرمجة، أو نادي المبرمجين."
  />

  <!-- Temporary Vercel URL for testing -->
  <meta
    name="twitter:image"
    content="https://finallandingpage-phi.vercel.app/og-image.png"
  />

  <meta
    name="twitter:image:alt"
    content="د. عيسى صبري — اختار طريقة الدراسة المناسبة ليك"
  />

  <!-- ── Fonts ─────────────────────────────────────────────────────── -->
  <!-- No external font loaded. Page uses system font stack: Segoe UI, Tahoma, Arial. -->

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
