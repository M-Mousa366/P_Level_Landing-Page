<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="طالب يحضر حصة أونلاين من البيت عبر لابتوب">
  <title>Online Live — شرح مباشر من البيت</title>
  <desc>مشهد طالب يجلس أمام لابتوب في بيته ويحضر حصة مباشرة</desc>

  <!-- Background: warm home room -->
  <rect width="800" height="600" fill="#e8f4f8"/>

  <!-- Wall -->
  <rect width="800" height="420" fill="#eef7fa"/>

  <!-- Window -->
  <rect x="560" y="60" width="180" height="220" rx="6" fill="#bde8f5" stroke="#9ad4ec" stroke-width="3"/>
  <line x1="650" y1="60" x2="650" y2="280" stroke="#9ad4ec" stroke-width="2"/>
  <line x1="560" y1="170" x2="740" y2="170" stroke="#9ad4ec" stroke-width="2"/>
  <!-- Window light glow -->
  <ellipse cx="650" cy="170" rx="80" ry="60" fill="#e0f5fd" opacity="0.5"/>

  <!-- Desk surface -->
  <rect x="0" y="380" width="800" height="220" fill="#d4c9b8"/>
  <rect x="0" y="378" width="800" height="5" fill="#b8ad9c"/>

  <!-- Desk detail: wood grain suggestion -->
  <rect x="0" y="385" width="800" height="1" fill="#c8bda8" opacity="0.5"/>
  <rect x="0" y="400" width="800" height="1" fill="#c8bda8" opacity="0.3"/>

  <!-- Laptop base -->
  <rect x="160" y="356" width="460" height="28" rx="8" fill="#d4d0c8"/>
  <rect x="172" y="362" width="436" height="14" rx="4" fill="#e0dcd4"/>
  <!-- Keyboard keys -->
  <g opacity="0.4">
    <rect x="188" y="364" width="24" height="8" rx="2" fill="#1a1a2e"/>
    <rect x="218" y="364" width="24" height="8" rx="2" fill="#1a1a2e"/>
    <rect x="248" y="364" width="24" height="8" rx="2" fill="#1a1a2e"/>
    <rect x="278" y="364" width="24" height="8" rx="2" fill="#1a1a2e"/>
    <rect x="308" y="364" width="24" height="8" rx="2" fill="#1a1a2e"/>
    <rect x="338" y="364" width="24" height="8" rx="2" fill="#1a1a2e"/>
    <rect x="368" y="364" width="24" height="8" rx="2" fill="#1a1a2e"/>
    <rect x="398" y="364" width="24" height="8" rx="2" fill="#1a1a2e"/>
    <rect x="428" y="364" width="24" height="8" rx="2" fill="#1a1a2e"/>
    <rect x="458" y="364" width="24" height="8" rx="2" fill="#1a1a2e"/>
    <rect x="488" y="364" width="60" height="8" rx="2" fill="#1a1a2e"/>
    <rect x="560" y="364" width="24" height="8" rx="2" fill="#1a1a2e"/>
  </g>
  <!-- Trackpad -->
  <rect x="356" y="368" width="72" height="12" rx="4" fill="#c8c4bc"/>

  <!-- Laptop screen body -->
  <rect x="150" y="80" width="480" height="282" rx="12" fill="#1a1a2e"/>
  <!-- Screen inner -->
  <rect x="162" y="92" width="456" height="258" rx="6" fill="#f8f9fa"/>

  <!-- Video meeting interface -->
  <!-- Main speaker tile (teacher) - large -->
  <rect x="170" y="100" width="280" height="180" rx="6" fill="#0d1629"/>
  <!-- Teacher in main tile -->
  <circle cx="310" cy="165" r="32" fill="#8b7355"/>
  <rect x="278" y="198" width="64" height="48" rx="10" fill="#2d3a5a"/>
  <!-- Whiteboard behind teacher -->
  <rect x="175" y="105" width="270" height="100" rx="4" fill="#1e2d50" opacity="0.6"/>
  <rect x="190" y="115" width="140" height="6" rx="3" fill="white" opacity="0.20"/>
  <rect x="190" y="127" width="100" height="5" rx="3" fill="white" opacity="0.15"/>
  <rect x="190" y="138" width="120" height="5" rx="3" fill="#14a085" opacity="0.35"/>
  <rect x="190" y="149" width="80"  height="5" rx="3" fill="#14a085" opacity="0.25"/>
  <!-- Name tag in main tile -->
  <rect x="175" y="265" width="80" height="14" rx="4" fill="#1a1a2e" opacity="0.7"/>
  <text x="215" y="276" font-family="sans-serif" font-size="8" fill="white" text-anchor="middle">المدرس</text>
  <!-- LIVE badge -->
  <rect x="412" y="104" width="52" height="22" rx="5" fill="#ef4444"/>
  <circle cx="420" cy="115" r="4" fill="white" opacity="0.9"/>
  <text x="445" y="119" font-family="sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">LIVE</text>

  <!-- Participant tiles (right column) -->
  <!-- Tile 2 -->
  <rect x="460" y="100" width="150" height="86" rx="6" fill="#1a2d3a"/>
  <circle cx="535" cy="133" r="18" fill="#c8a882"/>
  <rect x="517" y="153" width="36" height="22" rx="6" fill="#3b82f6" opacity="0.7"/>

  <!-- Tile 3 -->
  <rect x="460" y="194" width="150" height="86" rx="6" fill="#1e2d1e"/>
  <circle cx="535" cy="227" r="18" fill="#a07850"/>
  <rect x="517" y="247" width="36" height="22" rx="6" fill="#14a085" opacity="0.7"/>

  <!-- Bottom toolbar of video app -->
  <rect x="162" y="326" width="456" height="24" rx="4" fill="#1a1a2e" opacity="0.06"/>
  <!-- Toolbar icons -->
  <circle cx="220" cy="338" r="8" fill="#1a1a2e" opacity="0.15"/>
  <circle cx="248" cy="338" r="8" fill="#1a1a2e" opacity="0.15"/>
  <circle cx="276" cy="338" r="8" fill="#1a1a2e" opacity="0.15"/>
  <circle cx="304" cy="338" r="8" fill="#ef4444" opacity="0.25"/>
  <circle cx="540" cy="338" r="8" fill="#1a1a2e" opacity="0.15"/>
  <circle cx="568" cy="338" r="8" fill="#1a1a2e" opacity="0.15"/>

  <!-- Laptop camera dot -->
  <circle cx="390" cy="88" r="4" fill="#1a1a2e" opacity="0.4"/>

  <!-- Student sitting at desk (partial, behind laptop) -->
  <circle cx="390" cy="460" r="34" fill="#c8a882"/>
  <rect x="352" y="494" width="76" height="50" rx="10" fill="#8b5cf6" opacity="0.75"/>

  <!-- Earphones suggestion -->
  <path d="M 356 455 Q 340 430 356 415" stroke="#1a1a2e" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.35"/>
  <circle cx="355" cy="415" r="6" fill="#1a1a2e" opacity="0.30"/>

  <!-- Notebook on desk beside laptop -->
  <rect x="640" y="370" width="100" height="70" rx="4" fill="white" stroke="#c8c0d8" stroke-width="2"/>
  <rect x="648" y="382" width="84" height="5" rx="2" fill="#4a4a6a" opacity="0.15"/>
  <rect x="648" y="393" width="70" height="5" rx="2" fill="#4a4a6a" opacity="0.10"/>
  <rect x="648" y="404" width="78" height="5" rx="2" fill="#4a4a6a" opacity="0.10"/>
  <rect x="648" y="415" width="60" height="5" rx="2" fill="#14a085" opacity="0.20"/>
  <!-- Pen -->
  <rect x="752" y="372" width="8" height="60" rx="4" fill="#3b82f6" opacity="0.6"/>

  <!-- Caption -->
  <rect x="0" y="550" width="800" height="50" fill="#0d4a6a" opacity="0.88"/>
  <text x="400" y="582" font-family="Cairo, sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">شرح مباشر من البيت — Online Live</text>
</svg>
